name: viljaops

x-cp-env: &cp-env
  DATABASE_URL: postgresql+psycopg://viljaops:${POSTGRES_PASSWORD:-viljaops}@postgres:5432/viljaops
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  # See .env.example: flip to "production" only once JWT_SECRET,
  # BOOTSTRAP_ADMIN_PASSWORD, POSTGRES_PASSWORD, GITHUB_WEBHOOK_SECRET and
  # CORS_ALLOWED_ORIGINS are all set for real — the app refuses to start in
  # production with any of them left at their documented default.
  ENVIRONMENT: ${ENVIRONMENT:-development}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
  LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:14b}
  LLM_API_KEY: ${LLM_API_KEY:-ollama}
  EMBED_BASE_URL: ${EMBED_BASE_URL:-http://ollama:11434}
  EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
  EMBED_DIM: ${EMBED_DIM:-768}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  GITHUB_ORG: ${GITHUB_ORG:-}
  AUTO_REMEDIATION: "false"
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-DUMMY_PASSWORD_DO_NOT_USE}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: viljaops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viljaops}
      POSTGRES_DB: viljaops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viljaops"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Self-hosted inference. Swap for vLLM by pointing LLM_BASE_URL at it —
  # both speak the OpenAI-compatible /v1 API.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    # Uncomment on a GPU host (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

  control-plane:
    build: ./control-plane
    environment: *cp-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "8787:8000"
    volumes:
      - repocache:/var/lib/viljaops/repos
    restart: unless-stopped

  worker:
    build: ./control-plane
    command: ["celery", "-A", "app.workers.celery_app:celery", "worker", "-l", "info", "-Q", "analysis,rca,infra"]
    environment: *cp-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - repocache:/var/lib/viljaops/repos
    restart: unless-stopped

  beat:
    build: ./control-plane
    command: ["celery", "-A", "app.workers.celery_app:celery", "beat", "-l", "info"]
    environment: *cp-env
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5174:80"
    depends_on:
      - control-plane
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  ollamadata:
  repocache:
